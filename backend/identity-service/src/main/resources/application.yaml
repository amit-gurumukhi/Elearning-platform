spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/elearning_identity
    username: elearning
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info